<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NetLogger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #090d13; --surface: #0f1520; --surface2: #151e2e;
      --border: #1e2d45; --accent: #00e5ff; --text: #cdd9e5;
      --text-dim: #5c7494; --red: #ff3b5c; --green: #00ff88;
      --mono: 'Share Tech Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-family: var(--mono);
      font-size: 22px;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-control {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
    }

    .form-control::placeholder { color: var(--text-dim); }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-login:hover { background: #00aacc; }

    .alert-danger {
      background: rgba(255,59,92,0.08);
      border: 1px solid rgba(255,59,92,0.2);
      color: var(--red);
      font-size: 12px;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Scan line animation on the card */
    .login-card::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 3s linear infinite;
      opacity: 0.3;
      pointer-events: none;
    }

    @keyframes scan {
      0%   { top: 0; }
      100% { top: 100%; }
    }

    .login-card { position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">&#x25B6; NETLOGGER</div>
      <div class="login-sub">Network Session Monitor</div>
    </div>

    <div class="login-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-danger">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div style="margin-bottom: 18px;">
        <label class="form-label">Username</label>
        <input
          type="text"
          name="username"
          id="username"
          class="form-control"
          placeholder="enter username"
          autocomplete="off"
          required
        />
      </div>

      <div style="margin-bottom: 24px;">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          class="form-control"
          placeholder="••••••••"
          required
        />
      </div>

      <button class="btn-login" onclick="doLogin()">AUTHENTICATE</button>
    </div>

    <div class="login-footer">
      Unauthorized access is prohibited
    </div>
  </div>

  <script>
    function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/login';

      [['username', username], ['password', password]].forEach(([name, value]) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
